name: verify

# Every claim in the README runs against the released Opaque package, on a
# schedule, so the quickstart cannot rot. The CI run uses the insecure
# auto-approve backend; the transcript must show its audit attribution.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  quickstart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # bubblewrap is the namespace wrapper behind Act 3's sandbox.
          sudo apt-get install -y sqlite3 bubblewrap
          bwrap --version
          echo "kernel LSMs: $(cat /sys/kernel/security/lsm)"
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor. On this runner the bubblewrap package's profile was not
          # enough: the daemon's bwrap probe died at "loopback: Failed
          # RTM_NEWADDR: Operation not permitted" and unshare at "write failed
          # /proc/self/uid_map". The daemon's refusal names the remedy below;
          # the probes on either side of it document the effect in the log.
          probe() {
            echo "--- $1 ---"
            bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true \
              && echo 'bwrap --unshare-all: OK' || echo "bwrap --unshare-all: exit $?"
            unshare --user --map-root-user --mount --pid --net --fork /bin/true \
              && echo 'unshare user/mount/pid/net: OK' || echo "unshare user/mount/pid/net: exit $?"
          }
          sysctl kernel.apparmor_restrict_unprivileged_userns
          ls /etc/apparmor.d | grep -i bwrap || echo 'no bwrap AppArmor profile file'
          sudo aa-status 2>/dev/null | grep -i bwrap || echo 'no bwrap profile loaded'
          probe 'before sysctl'
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          probe 'after sysctl'

      - name: Install Opaque (released package)
        env:
          # Pin the release: deterministic, and skips the unauthenticated
          # GitHub API latest-release lookup that rate-limits on shared
          # runners. Bump on new Opaque releases.
          OPAQUE_VERSION: "0.6.0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL https://raw.githubusercontent.com/opaque-dev/opaque/main/install.sh \
            | OPAQUE_INSTALL="$RUNNER_TEMP/bin" sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          opaque --version
          opaqued --version

      - name: Regenerate the synthetic data and check determinism
        run: |
          set -euo pipefail
          python3 data/generate.py
          git diff --exit-code data/loan_applications.csv

      - name: Run the quickstart (CI mode)
        # Act 5 runs with --mock: no Vault binary is installed on the runner, so
        # the fully-stdlib mock path (the feasibility-verified one) keeps CI
        # deterministic. The real-Vault path is the default for local runs.
        run: |
          set -euo pipefail
          HARBORLIGHT_LOG_COPY="$PWD/opaqued.log" ./quickstart.sh --ci --mock 2>&1 | tee transcript.txt

      - name: Assert the story happened
        run: |
          set -euo pipefail
          grep -F 'ALLOW (rule: allow-test-noop)' transcript.txt
          grep -F 'DENY: no matching policy rule' transcript.txt
          grep -F 'demo_value_123456' transcript.txt
          grep -F 'unavailable (0 samples)' transcript.txt
          grep -F 'Sandbox exec succeeded' transcript.txt
          # The platform sandbox ran, and the audit row names the strategy.
          if [ "$RUNNER_OS" = Linux ]; then
            grep -E 'sandbox\.created\|profile=analyst argument_count=3 sandbox=(bubblewrap|unshare)\+landlock\+seccomp' transcript.txt
          else
            grep -F 'sandbox.created|profile=analyst argument_count=3 sandbox=seatbelt' transcript.txt
          fi
          grep -F 'code: policy_denied' transcript.txt
          grep -F 'Audit chain intact' transcript.txt
          grep -F 'TAMPER DETECTED' transcript.txt
          grep -F 'insecure_backend_active' transcript.txt
          # Act 5 — the bounded-task ledger
          grep -F 'Act 5 — The mandate' transcript.txt
          grep -F 'refused: the manifest authorized one write' transcript.txt
          grep -F 'refused: revocation blocks a task that has not run' transcript.txt
          grep -F 'INSECURE TEST APPROVAL' transcript.txt

      - name: Show the sandbox probe and strategy the daemon logged
        if: always() && runner.os == 'Linux'
        run: grep -F 'linux sandbox' opaqued.log || echo 'no linux sandbox lines in the daemon log'

      - name: Diagnose on failure
        if: failure()
        run: |
          echo '--- direct analyst run, unsandboxed (dummy token) ---'
          HARBORLIGHT_SOURCE_TOKEN=demo_value_123456 python3 agent/analyst.py report \
            || echo "direct run exit: $?"
          echo '--- bubblewrap probe ---'
          if command -v bwrap >/dev/null 2>&1; then
            bwrap --version || true
            bwrap --ro-bind / / --dev /dev --proc /proc /bin/true \
              && echo 'bwrap basic sandbox OK' \
              || echo "bwrap basic sandbox FAILED: $?"
          else
            echo 'bwrap not present'
          fi
          echo '--- daemon log tail ---'
          tail -60 opaqued.log 2>/dev/null || echo 'no daemon log captured'

      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.os }}
          path: |
            transcript.txt
            opaqued.log
